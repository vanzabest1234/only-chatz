# Deploy on push: every merge to `main` tells the host to rebuild and release.
#
# Render needs nothing from this file — its own Git integration redeploys on push
# (see `autoDeployTrigger: commit` in render.yaml). This workflow is the path for a
# host without a native Git connection: store its deploy hook as the repository
# secret DEPLOY_HOOK_URL and each push to main triggers a build. Without that secret
# the job is a no-op, so enabling it can never double-deploy a repo that relies on
# the host's own integration.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "DEPLOY_HOOK_URL is not set — nothing to call."
            echo "Render's own auto-deploy (render.yaml) still releases on push to main."
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK_URL" -o /dev/null -w 'host answered %{http_code}\n'
