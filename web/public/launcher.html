<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Only Chatz</title>
    <meta
      name="description"
      content="A small real-time chatroom: channels, direct messages, real roles and a live who's-online board."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        background: #0a0f14;
        color: #8fa3b0;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace;
        font-size: 13px;
        line-height: 1.65;
        font-weight: 400;
        text-transform: lowercase;
      }

      .page {
        position: relative;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        border-top: 1px solid #1d2a33;
        border-bottom: 1px solid #1d2a33;
        overflow: hidden;
      }

      .page:before {
        content: '';
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(116, 240, 166, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(116, 240, 166, 0.045) 1px, transparent 1px);
        background-size: 24px 24px;
        pointer-events: none;
      }

      .welcome {
        position: relative;
        z-index: 1;
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 48px 24px 40px;
        text-align: center;
      }

      .wordmark {
        margin: 0;
        color: #74f0a6;
        font-size: clamp(24px, 6vw, 32px);
        font-weight: 400;
        letter-spacing: 0.3em;
        text-shadow: 0 0 22px rgba(116, 240, 166, 0.4);
        line-height: 1.2;
      }

      .headline {
        margin: 0;
        color: #e6f1f7;
        font-size: clamp(17px, 4vw, 21px);
        font-weight: 400;
        letter-spacing: 0.12em;
      }

      .headline:after {
        content: '_';
        color: #74f0a6;
        margin-left: 4px;
        animation: blink 1.1s steps(1) infinite;
      }

      .lede {
        margin: 0;
        max-width: 46ch;
        color: #b7c7d1;
        font-size: 13.5px;
        line-height: 1.75;
      }

      .go {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-top: 4px;
        padding: 12px 26px;
        border: 1px solid #74f0a6;
        background: #74f0a6;
        color: #0a0f14;
        font: inherit;
        letter-spacing: 0.16em;
        text-decoration: none;
        transition:
          background 0.15s ease,
          box-shadow 0.15s ease;
      }

      .go:hover {
        background: #8ff7b9;
        box-shadow: 0 0 22px rgba(116, 240, 166, 0.4);
      }

      .go:active {
        background: #4fc884;
      }

      .go:focus-visible,
      .alt a:focus-visible,
      .foot a:focus-visible {
        outline: 2px solid #8fa3b0;
        outline-offset: 3px;
      }

      .go svg {
        width: 15px;
        height: 15px;
        fill: currentColor;
      }

      .alt {
        margin: 0;
        color: #5d717e;
      }

      .alt a {
        color: #e6f1f7;
        text-decoration: none;
        border-bottom: 1px solid #3a4c58;
      }

      .alt a:hover {
        color: #74f0a6;
        border-color: #74f0a6;
      }

      .foot {
        position: relative;
        z-index: 1;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 10px;
        padding: 14px 20px 18px;
        border-top: 1px solid #1d2a33;
        background: #0d141a;
        color: #5d717e;
        font-size: 11.5px;
        letter-spacing: 0.08em;
      }

      .foot a {
        color: #8fa3b0;
        text-decoration: none;
      }

      .foot a:hover {
        color: #74f0a6;
      }

      .sep {
        color: #3a4c58;
      }

      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .headline:after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <main class="welcome">
        <h1 class="wordmark">only chatz</h1>
        <h2 class="headline">Welcome to the room</h2>
        <p class="lede">
          A small real-time chatroom where everyone floats together. Live channels, direct messages,
          real roles, royal coins to gamble with and a board that shows who is online right now.
        </p>

        <a class="go" href="/chat" data-room>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 8h11l-3.2-3.2 1.1-1.1L15.2 8l-5.3 4.3-1.1-1.1L12 8H1z" /></svg>
          enter the chat
        </a>

        <p class="alt">new here? <a href="/chat" data-room>register now</a></p>
      </main>

      <footer class="foot">
        <span>2026 © only chatz</span>
        <span class="sep">·</span>
        <a href="/chat" data-room id="room-newtab">open in a new tab</a>
      </footer>
    </div>

    <script>
      // Carry the current query string (a hosted preview's access token) onto the
      // room links. Without it the plain /chat href still loads the room.
      (function () {
        var links = document.querySelectorAll('[data-room]');
        if (location.search) {
          for (var i = 0; i < links.length; i++) {
            links[i].setAttribute('href', '/chat' + location.search);
          }
        }

        // The new-tab link: a sandboxed frame turns `target="_blank"` into about:blank,
        // so the tab is opened from script and, when popups are blocked, the plain href
        // simply takes this tab to the room. The tab gets the bare /chat path — the
        // session lives in localStorage, so it needs none of the preview's long token URL.
        var newTab = document.getElementById('room-newtab');
        if (!newTab) return;
        newTab.setAttribute('href', '/chat');

        newTab.addEventListener('click', function (event) {
          var opened = null;
          try {
            opened = window.open('/chat', '_blank');
          } catch (error) {
            opened = null;
          }
          if (!opened || opened.closed) return; // blocked: let the anchor do the work
          try {
            opened.opener = null;
          } catch (error) {
            /* already detached */
          }

          // Some sandboxed frames hand back a tab that stays on about:blank. Rather than
          // leaving the person on a blank page, drop that tab and open the room here.
          setTimeout(function () {
            var stuck = false;
            try {
              stuck = opened.closed || opened.location.href === 'about:blank';
            } catch (error) {
              stuck = false;
            }
            if (!stuck) return;
            try {
              opened.close();
            } catch (error) {
              /* already gone */
            }
            location.assign('/chat');
          }, 400);

          event.preventDefault();
        });
      })();
    </script>
  </body>
</html>
