<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>only chatz</title>
    <meta name="description" content="A floaty little chatroom for everyone." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232e3339'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%2374f0a6' stroke-width='3'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        --ink: #e8edf2;
        --ink-dim: #9aa6b2;
        --panel: #2e3339;
        --panel-2: #373d44;
        --seam: #454c54;
        --green: #74f0a6;
        --green-deep: #4fce86;
        --bg: #1b1f23;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(1200px 600px at 50% -10%, #242a30 0%, transparent 60%),
          var(--bg);
        color: var(--ink);
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: min(440px, 100%);
        background: var(--panel);
        border: 1px solid var(--seam);
        border-radius: 10px;
        padding: 32px 28px 26px;
        text-align: center;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.04);
      }
      .mark {
        width: 52px;
        height: 52px;
        margin: 0 auto 16px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: var(--panel-2);
        border: 1px solid var(--seam);
        color: var(--green);
        font-size: 24px;
        line-height: 1;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 22px;
        letter-spacing: 0.12em;
        text-transform: lowercase;
        font-weight: 600;
      }
      p {
        margin: 0 auto 24px;
        max-width: 30ch;
        color: var(--ink-dim);
        font-size: 13px;
        line-height: 1.6;
      }
      .enter {
        display: block;
        width: 100%;
        padding: 14px 18px;
        border-radius: 8px;
        border: 1px solid var(--green-deep);
        background: linear-gradient(180deg, var(--green) 0%, var(--green-deep) 100%);
        color: #10241a;
        font-family: inherit;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        text-decoration: none;
        transition: filter 140ms ease, transform 140ms ease;
      }
      .enter:hover { filter: brightness(1.06); transform: translateY(-1px); }
      .enter:active { transform: translateY(0); }
      .enter:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
      footer {
        margin-top: 22px;
        padding-top: 16px;
        border-top: 1px solid var(--seam);
        color: var(--ink-dim);
        font-size: 11px;
        letter-spacing: 0.04em;
      }
      footer a { color: var(--ink-dim); text-decoration: none; border-bottom: 1px dotted var(--seam); }
      footer a:hover { color: var(--green); }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark" aria-hidden="true">◍</div>
      <h1>only chatz</h1>
      <p>a floaty little chatroom for everyone. pick a name, say hello.</p>
      <a class="enter" id="enter" href="__CHAT_URL__">Enter the chat</a>
      <footer>
        the room lives on its own server · <a href="https://github.com/vanzabest1234/only-chatz">source</a>
      </footer>
    </main>
  </body>
</html>
