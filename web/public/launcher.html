<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Only Chatz — open the room</title>
    <meta
      name="description"
      content="Open the Only Chatz room in a bare about:blank tab or right inside this page."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      /* The chat's slate room with a light card standing in it. */
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        padding: 24px 16px;
        background:
          radial-gradient(circle at 50% -10%, rgba(116, 240, 166, 0.09), transparent 55%),
          linear-gradient(#33383d, #2c3136);
        color: #6c757d;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace;
        font-size: 13px;
        line-height: 1.65;
        text-transform: lowercase;
      }

      .card {
        width: min(520px, 100%);
        padding: 26px 24px 22px;
        border: 1px solid rgba(0, 0, 0, 0.1);
        border-radius: 14px;
        background: #ffffff;
        box-shadow: 0 20px 46px rgba(0, 0, 0, 0.4);
        text-align: center;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 11px;
        border-radius: 999px;
        background: #eef2f5;
        color: #5b6b7b;
        font-size: 10px;
        letter-spacing: 0.16em;
      }

      .badge:before {
        content: '';
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #3fae6a;
      }

      h1 {
        margin: 10px 0 0;
        color: #2c7a52;
        font-size: clamp(24px, 6vw, 31px);
        font-weight: 700;
        letter-spacing: 0.22em;
        line-height: 1.2;
        text-shadow: 0 0 20px rgba(63, 174, 106, 0.3);
      }

      .lede {
        margin: 8px auto 0;
        max-width: 40ch;
        color: #6c757d;
        font-size: 12.5px;
        line-height: 1.75;
      }

      .choices {
        display: grid;
        gap: 9px;
        margin: 18px 0 0;
      }

      .go {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 13px 18px;
        border: 1px solid #2f9e57;
        border-radius: 9px;
        background: #2f9e57;
        color: #ffffff;
        font: inherit;
        font-size: 12.5px;
        font-weight: 700;
        letter-spacing: 0.12em;
        cursor: pointer;
        transition:
          background 0.15s ease,
          box-shadow 0.15s ease,
          color 0.15s ease;
      }

      .go:hover {
        background: #37b463;
        box-shadow: 0 0 0 3px rgba(47, 158, 87, 0.16);
      }

      .go:active {
        background: #28894a;
      }

      .go.alt {
        border-color: #d7e0e8;
        background: #f5f8fa;
        color: #162a4a;
      }

      .go.alt:hover {
        border-color: #3fae6a;
        background: #ffffff;
        color: #2c7a52;
        box-shadow: 0 0 0 3px rgba(47, 158, 87, 0.12);
      }

      .go:focus-visible,
      .foot a:focus-visible {
        outline: 2px solid #3fae6a;
        outline-offset: 3px;
      }

      .hint {
        margin: 12px 0 0;
        min-height: 1.6em;
        color: #8a969f;
        font-size: 11.5px;
        line-height: 1.7;
      }

      .hint.bad {
        color: #b23b3b;
      }

      .foot {
        margin: 14px 0 0;
        padding-top: 12px;
        border-top: 1px solid #e4ebf1;
        font-size: 11.5px;
      }

      .foot a {
        color: #2c7a52;
        font-weight: 700;
        text-decoration: none;
        border-bottom: 1px solid #b9c6d1;
      }

      .foot a:hover {
        border-color: #2c7a52;
      }

      /* the in-page room fills the whole viewport once it is chosen */
      body.staged {
        padding: 0;
        background: #2e3339;
      }

      body.staged .card {
        display: none;
      }

      .stage {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: #2e3339;
      }

      .close {
        position: fixed;
        top: 10px;
        right: 12px;
        z-index: 2;
        width: 30px;
        height: 30px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 8px;
        background: rgba(20, 24, 27, 0.72);
        color: #c3ccd3;
        font: inherit;
        font-size: 16px;
        line-height: 1;
        cursor: pointer;
      }

      .close:hover {
        color: #74f0a6;
        border-color: #3fae6a;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="badge">live chatroom</span>
      <h1>only chatz</h1>
      <p class="lede">pick how the room opens — both choices land you in the chat.</p>

      <div class="choices">
        <button type="button" class="go" id="blank">open in about:blank</button>
        <button type="button" class="go alt" id="frame">open in iframe</button>
      </div>

      <p class="hint" id="hint">
        about:blank opens a bare tab with nothing in the address bar. iframe keeps the room on this
        page.
      </p>

      <p class="foot"><a href="/">just open the room →</a></p>
    </main>

    <!-- Logic lives in /launcher.js: this preview does not run inline scripts. -->
    <script src="/launcher.js" defer></script>
  </body>
</html>
